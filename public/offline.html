<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf5" />
    <title>PupXpress — Connection unavailable</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #fffaf5;
        color: #1c1917;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: calc(2rem + env(safe-area-inset-top)) 1.5rem
          calc(2rem + env(safe-area-inset-bottom));
        text-align: center;
      }
      main {
        width: min(100%, 24rem);
      }
      .mark {
        width: 5rem;
        height: 5rem;
        margin: 0 auto 1.5rem;
        display: grid;
        place-items: center;
        border-radius: 1.5rem;
        background: #ffedd5;
        font-size: 2.5rem;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        line-height: 1.25;
      }
      p {
        margin: 0.75rem 0 1.5rem;
        color: #78716c;
        line-height: 1.55;
      }
      button {
        width: 100%;
        min-height: 3rem;
        border: 0;
        border-radius: 0.75rem;
        background: #f97316;
        color: white;
        font: inherit;
        font-weight: 700;
      }
      button:active {
        background: #ea580c;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">🐾</div>
      <h1>PupXpress couldn’t connect</h1>
      <p>Check your internet connection, then try again. Your saved account information is safe.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        window.location.href = "https://pupexpress.lovable.app";
      });
    </script>
  </body>
</html>
