<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Returning to PupXpress</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: #fff7ed;
        color: #292524;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }

      main {
        max-width: 360px;
      }

      .paw {
        font-size: 42px;
      }

      a {
        background: #f97316;
        border-radius: 12px;
        color: white;
        display: inline-block;
        font-weight: 600;
        margin-top: 16px;
        padding: 12px 20px;
        text-decoration: none;
      }

      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="paw" aria-hidden="true">🐾</div>
      <h1 id="title">Returning to PupXpress…</h1>
      <p id="message">Your sign-in is complete. The app should reopen automatically.</p>
      <a id="return-link" href="#" hidden>Return to PupXpress</a>
    </main>
    <script>
      (function () {
        var query = new URLSearchParams(window.location.search);
        var hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
        var state = query.get("state") || hash.get("state");
        var title = document.getElementById("title");
        var message = document.getElementById("message");
        var returnLink = document.getElementById("return-link");

        if (!state || state.indexOf("pupx-native.") !== 0) {
          title.textContent = "Sign-in response not recognized";
          message.textContent = "Return to PupXpress and try signing in again.";
          return;
        }

        var deepLink =
          "com.pupxpress.app://auth/callback" + window.location.search + window.location.hash;

        // Remove tokens from the browser history before handing control back
        // to the app. The in-memory deep link still carries the response.
        window.history.replaceState(null, "", window.location.pathname);
        returnLink.href = deepLink;
        returnLink.hidden = false;

        window.location.replace(deepLink);
      })();
    </script>
  </body>
</html>
